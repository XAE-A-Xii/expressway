<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurugram Sector Map (Sectors 1–115) | GMDA Official Boundaries</title>
  <meta name="description" content="Interactive high-resolution sector boundary map of Gurugram Sectors 1 to 115 based on official GMDA / Haryana DTCP GIS data.">
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <div id="app-container">
    <!-- Top Glass Header -->
    <header class="navbar glass">
      <div class="navbar-top-row">
        <div class="brand-section">
          <div class="logo-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
              <line x1="8" y1="2" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Gurugram <span>Sectors 1–115</span></h1>
            <p class="brand-subtitle">Official GMDA & DTCP Boundary GIS Layer</p>
          </div>
        </div>

        <div class="header-actions">
          <!-- Basemap toggle -->
          <div class="btn-group">
            <button id="btn-basemap-dark" class="btn-toggle active" title="Dark Carto Map">Dark</button>
            <button id="btn-basemap-light" class="btn-toggle" title="Light Voyager Map">Light</button>
            <button id="btn-basemap-sat" class="btn-toggle" title="Satellite Imagery">Satellite</button>
          </div>

          <!-- Reset Zoom -->
          <button id="btn-reset-view" class="icon-btn" title="Reset View to Gurugram">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>

          <!-- Toggle Sidebar -->
          <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle Sector Directory">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="header-center">
        <!-- Search bar -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="sector-search" placeholder="Search Sector (e.g. 56, 102, 29, M1)..." autocomplete="off">
          <button id="clear-search" class="clear-btn" title="Clear search" style="display:none;">&times;</button>
        </div>

        <!-- Quick filter chips -->
        <div class="filter-chips">
          <button class="chip active" data-filter="all">All Sectors</button>
          <button class="chip" data-filter="core">Core (1–115)</button>
          <button class="chip" data-filter="dwarka">Dwarka Expy (99–115)</button>
          <button class="chip" data-filter="golf">Golf Course / SPR (42–70)</button>
          <button class="chip" data-filter="manesar">Manesar (M1–M15)</button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-body">
      <!-- Leaflet Map Container -->
      <div id="map"></div>

      <!-- Floating Stat Bar / Pill -->
      <div class="stats-pill glass">
        <div class="stat-item">
          <span class="stat-num" id="stat-visible-sectors">151</span>
          <span class="stat-label">Gurugram Sectors</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num" id="stat-total-polygons">175</span>
          <span class="stat-label">Total Boundaries</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-num">100% Official</span>
          <span class="stat-label">GMDA Vector GIS</span>
        </div>
      </div>

      <!-- Sector Detail Floating Card / Mobile Bottom Sheet -->
      <div id="sector-card" class="sector-card glass">
        <div class="sheet-drag-handle"></div>
        <div class="card-header">
          <div class="badge-region" id="card-region">Gurugram Core</div>
          <button id="card-close-btn" class="card-close">&times;</button>
        </div>
        <div class="card-title-row">
          <h2 id="card-sector-name">Sector 56</h2>
          <span class="card-density-badge" id="card-density">Density: 250/100</span>
        </div>
        <div class="card-stats-grid">
          <div class="card-stat-box">
            <span class="cs-label">Area (Acres)</span>
            <span class="cs-val" id="card-area-acres">650.08</span>
          </div>
          <div class="card-stat-box">
            <span class="cs-label">Area (Sq Km)</span>
            <span class="cs-val" id="card-area-sqkm">2.631</span>
          </div>
          <div class="card-stat-box">
            <span class="cs-label">Perimeter</span>
            <span class="cs-val" id="card-perimeter">6.28 km</span>
          </div>
          <div class="card-stat-box">
            <span class="cs-label">Status</span>
            <span class="cs-val" id="card-source">GMDA GIS</span>
          </div>
        </div>
        <div class="card-actions">
          <button id="btn-zoom-sector" class="btn-primary">Zoom In</button>
          <a id="btn-google-maps" class="btn-secondary" target="_blank" rel="noopener">Open in Google Maps</a>
        </div>
      </div>

      <!-- Backdrop for mobile drawer -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Sidebar Directory of All Sectors -->
      <aside id="sidebar-directory" class="sidebar glass">
        <div class="sidebar-header">
          <div class="sidebar-title-wrap">
            <h3>Sector Directory</h3>
            <span class="sidebar-count" id="directory-count">175</span>
          </div>
          <button id="btn-close-sidebar" class="icon-btn-sm">&times;</button>
        </div>
        
        <div class="sidebar-search">
          <input type="text" id="directory-filter-input" placeholder="Filter list...">
        </div>

        <div class="directory-list" id="directory-list-container">
          <!-- Populated by JS -->
        </div>
      </aside>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
